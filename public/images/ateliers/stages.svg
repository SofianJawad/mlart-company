<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Prendre sa place sur scène — pratique artistique">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221b1e"/>
      <stop offset="1" stop-color="#0e0b0d"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead9a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ead9a3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- projecteur -->
  <polygon points="480,-50 720,-50 900,820 300,820" fill="url(#spot)"/>
  <!-- figure au centre de la scène -->
  <circle cx="600" cy="470" r="52" fill="#faf4ec"/>
  <path d="M600 522 l30 190 M600 560 l-96 120 M600 560 l96 120 M600 712 l-70 160 M600 712 l70 160" stroke="#faf4ec" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- halo au sol -->
  <ellipse cx="600" cy="900" rx="260" ry="34" fill="#c9a24b" opacity="0.6"/>
  <!-- ligne de scène -->
  <rect x="180" y="930" width="840" height="6" rx="3" fill="#c9a24b" opacity="0.8"/>
  <!-- étincelles -->
  <path d="M330 380l18 40 40 18-40 18-18 40-18-40-40-18 40-18z" fill="#c9a24b"/>
  <path d="M870 300l16 34 34 16-34 16-16 34-16-34-34-16 34-16z" fill="#9e2334" opacity="0.85"/>
  <g fill="#ead9a3" opacity="0.7">
    <circle cx="280" cy="620" r="10"/>
    <circle cx="920" cy="580" r="10"/>
    <circle cx="600" cy="150" r="8"/>
  </g>
</svg>
