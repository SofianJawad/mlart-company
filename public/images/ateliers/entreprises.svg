<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Cohésion d'équipe et créativité collective">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221b1e"/>
      <stop offset="1" stop-color="#0e0b0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- cercles de l'équipe, entrelacés -->
  <circle cx="440" cy="600" r="200" fill="none" stroke="#c9a24b" stroke-width="7"/>
  <circle cx="600" cy="440" r="200" fill="none" stroke="#9e2334" stroke-width="7"/>
  <circle cx="760" cy="600" r="200" fill="none" stroke="#ead9a3" stroke-width="5"/>
  <circle cx="600" cy="760" r="200" fill="none" stroke="#faf4ec" stroke-width="4" opacity="0.85"/>
  <!-- étoile au cœur du collectif -->
  <path d="M600 470l30 66 66 30-66 30-30 66-30-66-66-30 66-30z" fill="#c9a24b"/>
  <!-- petites étoiles -->
  <path d="M300 300l18 40 40 18-40 18-18 40-18-40-40-18 40-18z" fill="#faf4ec" opacity="0.7"/>
  <path d="M900 880l18 40 40 18-40 18-18 40-18-40-40-18 40-18z" fill="#9e2334" opacity="0.85"/>
  <g fill="#ead9a3" opacity="0.7">
    <circle cx="920" cy="300" r="11"/>
    <circle cx="290" cy="900" r="11"/>
  </g>
</svg>
