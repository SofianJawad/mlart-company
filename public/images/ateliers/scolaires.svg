<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Créativité, expression et confiance en soi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221b1e"/>
      <stop offset="1" stop-color="#0e0b0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- étoile principale : l'étincelle créative -->
  <path d="M600 200l55 120 120 55-120 55-55 120-55-120-120-55 120-55z" fill="#c9a24b"/>
  <path d="M600 200l40 88 88 40-88 40-40 88-40-88-88-40 88-40z" fill="#faf4ec" opacity="0.55"/>
  <!-- cercle orbital -->
  <circle cx="600" cy="600" r="300" fill="none" stroke="#ead9a3" stroke-width="2" opacity="0.45"/>
  <!-- petites étoiles satellites -->
  <path d="M290 330l22 48 48 22-48 22-22 48-22-48-48-22 48-22z" fill="#9e2334"/>
  <path d="M905 860l20 44 44 20-44 20-20 44-20-44-44-20 44-20z" fill="#9e2334" opacity="0.85"/>
  <path d="M905 300l16 34 34 16-34 16-16 34-16-34-34-16 34-16z" fill="#faf4ec" opacity="0.7"/>
  <!-- points -->
  <g fill="#ead9a3" opacity="0.7">
    <circle cx="330" cy="860" r="12"/>
    <circle cx="600" cy="960" r="9"/>
    <circle cx="290" cy="600" r="9"/>
    <circle cx="915" cy="600" r="11"/>
  </g>
  <!-- fines lignes rayonnantes -->
  <g stroke="#c9a24b" stroke-width="2" opacity="0.5">
    <line x1="600" y1="120" x2="600" y2="170"/>
    <line x1="770" y1="200" x2="740" y2="230"/>
    <line x1="430" y1="200" x2="460" y2="230"/>
  </g>
</svg>
